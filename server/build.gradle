plugins {
  id 'application'
}

java.sourceCompatibility = 11
java.targetCompatibility = 11
eclipse.project.name = appName + '-server'
application.mainClass.set('io.github.VincentL0L.VARraces.server.RaceServer')

dependencies {
  implementation project(':core')
  implementation "org.java-websocket:Java-WebSocket:$javaWebSocketVersion"
  implementation "org.slf4j:slf4j-simple:1.7.36"
}

// the server needs each map's road mask so CPUs are never pushed off the road
processResources {
  from(rootProject.file('assets/ui/road_mask.png'))
  from(rootProject.file('assets/maps/sf/road_mask.png')) {
    rename { 'sf_road_mask.png' }
  }
  from(rootProject.file('assets/maps/tokyo/road_mask.png')) {
    rename { 'tokyo_road_mask.png' }
  }
  from(rootProject.file('assets/maps/nyc/road_mask.png')) {
    rename { 'nyc_road_mask.png' }
  }
  from(rootProject.file('assets/maps/chicago/road_mask.png')) {
    rename { 'chicago_road_mask.png' }
  }
  from(rootProject.file('assets/maps/london/road_mask.png')) {
    rename { 'london_road_mask.png' }
  }
  from(rootProject.file('assets/maps/paris/road_mask.png')) {
    rename { 'paris_road_mask.png' }
  }
  from(rootProject.file('assets/maps/taipei/road_mask.png')) {
    rename { 'taipei_road_mask.png' }
  }
}

// one runnable jar with everything inside: server/build/libs/var-races-server.jar
jar {
  archiveFileName.set('var-races-server.jar')
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  manifest {
    attributes 'Main-Class': application.mainClass.get()
  }
}
