[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  testImplementation files('../lib/junit-4.13.2.jar', '../lib/hamcrest-core-1.3.jar')
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"


  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}
test {
  systemProperty 'varraces.assets', rootProject.file('assets').absolutePath
}
task generateJavadoc(type: Javadoc) {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    destinationDir = file("$buildDir/docs/javadoc")
    options.encoding = 'UTF-8'
    options.author = true
    options.version = true
    // You can customize more options here if you want
}
