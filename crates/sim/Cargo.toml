[package]
name = "sim"
description = "VAR Races game simulation, shared by the server and the browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
serde.workspace = true

# TypeScript declarations for the browser (crates/wasm)
tsify = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }

[features]
ts = ["dep:tsify", "dep:wasm-bindgen"]
